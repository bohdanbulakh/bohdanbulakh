name: Update profile stats

on:
  schedule:
    # Daily at 03:17 UTC. Off-the-hour keeps it out of the busiest scheduler slot.
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-stats.mjs'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Render cards
        env:
          # GH_STATS_TOKEN is optional: a classic PAT with read:user makes the
          # contribution tiles available. Without it the run still succeeds and
          # the card falls back to the repo-only tiles.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "No change in generated cards."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m 'chore: refresh profile stats cards'
          git push
